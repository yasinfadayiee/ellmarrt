name: Daily improvement

# Twice a day Claude does the next item of AUTOPILOT.md (product pages, category copy, small UX fixes), then this
# workflow checks the change itself before it goes live:
#   - only allowed paths changed (no workflows, admin data, Basalam sync or dependencies),
#   - the full build passes and the site output exists.
# If all is well it commits to main (GitHub Pages publishes it), pings IndexNow and tells the owner on Telegram;
# otherwise nothing is published and the owner is told.
#
# Uses the owner's SECOND Claude account through CLAUDE_CODE_OAUTH_TOKEN (no API bill), Sonnet with a turn cap.
# 2026-10-26 portfolio focus: the first Claude account is kept for AgedSocials. 05:00 in Iran (UTC+3:30).
on:
  schedule:
    # 2026-10-27: owner no longer uses the second Claude account itself, so this runs twice a day to use its limit.
    - cron: '30 1 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:

# one build at a time, shared with the Basalam sync and the admin-panel build
concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUMMARY: /tmp/elm-summary.txt
    steps:
      - id: token
        run: echo "set=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Health check (free)
        id: health
        run: |
          bad=""
          for u in https://ellmarrt.ir/ https://ellmarrt.ir/sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$u" || echo 000)
            [ "$code" = 200 ] || bad="$bad $u=$code"
          done
          echo "bad=$bad" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.token.outputs.set == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.set == 'true'
        run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.set == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model sonnet --max-turns 25
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node scripts/build.js),Bash(git diff:*),Bash(git status)"
          prompt: |
            You improve the ELLMARRT website (ellmarrt.ir, Persian menswear shop in the Tabriz covered bazaar);
            the working directory is its repository. Read AUTOPILOT.md first: it has the rules and the Backlog.
            Do the first unchecked Backlog item only, following the rules, run `node scripts/build.js` once at
            the end, then tick the item in AUTOPILOT.md (`- [x] (YYYY-MM-DD) ...`, today's date).
            Do not commit, push or open pull requests.
            Finally write a one-line summary in simple Persian for the owner to /tmp/elm-summary.txt.

      - name: Check and publish
        id: publish
        if: steps.token.outputs.set == 'true'
        run: |
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then echo "result=nothing" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(\.github/|admin/|uploads/|data-raw/|data/overrides\.json$|data/orders\.json$|scripts/sync-basalam\.js$|package(-lock)?\.json$)'; then
            echo "result=forbidden" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! node scripts/build.js; then echo "result=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -f docs/index.html ] && [ -f docs/sitemap.xml ] || { echo "result=failed" >> "$GITHUB_OUTPUT"; exit 0; }
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          item=$(git diff --cached AUTOPILOT.md | grep -m1 '^+- \[x\]' | cut -c8- | cut -c1-120)
          git diff --cached --name-only | grep -E '^docs/.*index\.html$' | sed -E 's#^docs/##; s#index\.html$##; s#^#https://ellmarrt.ir/#' > /tmp/urls.txt || true
          git commit -m "Daily improvement: ${item:-roadmap item}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "result=published" >> "$GITHUB_OUTPUT"

      - name: IndexNow
        if: steps.publish.outputs.result == 'published'
        continue-on-error: true
        run: |
          [ -s /tmp/urls.txt ] || exit 0
          sleep 150   # GitHub Pages needs ~1-3 min to publish
          node -e '
            const urls = require("fs").readFileSync("/tmp/urls.txt", "utf8").split("\n").filter(Boolean).slice(0, 500);
            const key = "5553601b0a9b596a60aaaad7a46fb679";
            fetch("https://api.indexnow.org/indexnow", { method: "POST", headers: { "content-type": "application/json" },
              body: JSON.stringify({ host: "ellmarrt.ir", key, keyLocation: `https://ellmarrt.ir/${key}.txt`, urlList: urls }) })
              .then(r => console.log("IndexNow", r.status, urls.length));'

      - name: Tell the owner on Telegram
        if: always()
        env:
          RESULT: ${{ steps.publish.outputs.result }}
          TOKEN_SET: ${{ steps.token.outputs.set }}
          BAD: ${{ steps.health.outputs.bad }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          summary=$(head -c 600 "$SUMMARY" 2>/dev/null || true)
          case "$RESULT" in
            published) text="🛍 المارت — بهبود امروز منتشر شد:
          ${summary}" ;;
            nothing) text="ℹ️ المارت — امروز تغییری لازم نبود." ;;
            forbidden) text="⛔️ المارت — تغییر امروز به بخش‌های حساس دست زده بود و منتشر نشد. $RUN_URL" ;;
            failed) text="⚠️ المارت — تغییر امروز ساخت سایت را خراب می‌کرد و منتشر نشد. $RUN_URL" ;;
            *) if [ "$TOKEN_SET" != "true" ]; then text=""; else
               text="⚠️ المارت — بهبود خودکار امروز اجرا نشد (شاید سهمیه‌ی Claude تمام شده بود). فردا دوباره امتحان می‌کند. $RUN_URL"; fi ;;
          esac
          [ -n "$BAD" ] && text="🔴 المارت — سایت جواب نمی‌دهد:$BAD
          $text"
          [ -n "$text" ] || exit 0
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
